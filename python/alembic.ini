# Migrações do banco (Alembic). A URL vem de COCHEF_DB_URL (ou do .env), não deste arquivo.
#   alembic upgrade head        aplica as migrações
#   alembic revision --autogenerate -m "descrição"   gera uma nova a partir dos modelos
[alembic]
script_location = %(here)s/app/db/migracoes
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
