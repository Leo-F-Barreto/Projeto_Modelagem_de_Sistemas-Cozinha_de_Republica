# Sobe o CoChef com PostgreSQL 16. Rode a partir da pasta python/:  docker compose up --build
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: cochef
      POSTGRES_PASSWORD: cochef
      POSTGRES_DB: cochef
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cochef"]
      interval: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: python/Dockerfile
    environment:
      COCHEF_DB_URL: postgresql+psycopg://cochef:cochef@banco:5432/cochef
      COCHEF_JWT_SEGREDO: ${COCHEF_JWT_SEGREDO:?defina COCHEF_JWT_SEGREDO com 32 caracteres ou mais}
    ports:
      - "3000:3000"
    depends_on:
      banco:
        condition: service_healthy
volumes:
  dados-banco:
